# Not used by CI.
name: highland
channels:
  - conda-forge
  - nodefaults
dependencies:
  - pyvista==0.49.1
  - trame==4.0.0
  - trame-vtk==2.11.17
  - trame-vuetify==3.3.0
  - pytest-playwright==0.10.0
