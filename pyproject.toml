[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "highland"
version = "0.1.0"
description = "Canopy change, canopy classes and watershed risk for Sri Lanka's central highlands."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are pinned in environment.yml (the conda env is the single source of truth);
# install the package with `pip install -e . --no-deps`.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/highland"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
addopts = "--strict-markers -ra"
testpaths = ["tests"]
markers = [
    "network: needs internet; skipped in CI",
    "viewer: browser test via pytest-playwright; local only",
]
